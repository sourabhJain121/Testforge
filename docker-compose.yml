services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: testforge-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - TOKEN_HARBOR_API_KEY=${TOKEN_HARBOR_API_KEY:-}
      - TOKEN_HARBOR_BASE_URL=${TOKEN_HARBOR_BASE_URL:-https://tokenharbor.ai/v1}
      - TOKEN_HARBOR_MODEL=${TOKEN_HARBOR_MODEL:-deepseek-v4.1-flash:free}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-codellama:7b}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - ./qa_artifacts:/app/qa_artifacts
      - ./samples:/app/samples
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - testforge-net

  ollama:
    image: ollama/ollama:latest
    container_name: testforge-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    networks:
      - testforge-net

  dashboard:
    profiles:
      - legacy-streamlit
    build:
      context: .
      dockerfile: Dockerfile
    container_name: testforge-dashboard
    restart: unless-stopped
    command: ["streamlit", "run", "app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - TESTFORGE_API_URL=http://backend:8000
      - TOKEN_HARBOR_API_KEY=${TOKEN_HARBOR_API_KEY:-}
      - TOKEN_HARBOR_BASE_URL=${TOKEN_HARBOR_BASE_URL:-https://tokenharbor.ai/v1}
      - TOKEN_HARBOR_MODEL=${TOKEN_HARBOR_MODEL:-deepseek-v4.1-flash:free}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-codellama:7b}
    networks:
      - testforge-net

volumes:
  ollama_storage:

networks:
  testforge-net:
    driver: bridge
